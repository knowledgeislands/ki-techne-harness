AWSTemplateFormatVersion: '2010-09-09'
Description: Prototype agent host reached only over Tailscale SSH (KI-ARCADIA-GOV-020)

Parameters:
  AgentHostId:
    Type: String
    AllowedPattern: '[a-z0-9-]+'
    Default: agent-host
  HostName:
    Type: String
    AllowedPattern: '[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
    Default: ki-techne-agent-host
  TailscaleHostname:
    Type: String
    AllowedPattern: '[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
    Default: ki-techne-agent-host
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0526a6499f6470118
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, t3.xlarge]
  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 16
    MaxValue: 100
  OperatorUser:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{0,30}'
    Default: techne
  TailscaleTag:
    Type: String
    AllowedPattern: 'tag:[a-z0-9-]+'
    Default: tag:ki-techne-agent-host
  ParameterPrefix:
    Type: String
    AllowedPattern: '/[a-z0-9/-]+'
    Default: /ki/techne/agent-host
  # OS patching (TECHNE-TOOLS-OPS-022): a daily host-local HH:MM at which the
  # host restarts itself when a reboot is required and nobody is logged in;
  # empty, the default, means it never restarts itself.
  RebootWindow:
    Type: String
    AllowedPattern: '(([01][0-9]|2[0-3]):[0-5][0-9])?'
    Default: ''
  Livepatch:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  NodeMajorVersion:
    Type: String
    AllowedPattern: '[0-9]+'
    Default: '24'
  VpcCidr:
    Type: String
    Default: 10.90.0.0/24
  PublicSubnetCidr:
    Type: String
    Default: 10.90.0.0/25

Resources:
  AgentHostVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref AgentHostVpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref AgentHostVpc
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AgentHostVpc
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet

  # No ingress rules. DNS to the VPC resolver, instance metadata and Amazon
  # Time Sync are not filtered by security groups, so they need no egress rule.
  AgentHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No ingress; agent-host egress for GitHub, model API, packages and Tailscale
      VpcId: !Ref AgentHostVpc
      SecurityGroupEgress:
        - Description: HTTPS for GitHub, model API, package registries, SSM and Tailscale control and DERP
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: Signed Ubuntu package archives over HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Tailscale STUN for DERP path discovery
          IpProtocol: udp
          FromPort: 3478
          ToPort: 3478
          CidrIp: 0.0.0.0/0
        - Description: Tailscale direct peer connections to the default port
          IpProtocol: udp
          FromPort: 41641
          ToPort: 41641
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  AgentHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-agent-host-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAgentHostParameters
                Effect: Allow
                Action: ['ssm:GetParameter', 'ssm:GetParameters']
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*
              - Sid: DecryptOnlyThroughParameterStore
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020

  AgentHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AgentHostRole]

  AgentHostInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AgentHostInstanceProfile
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions:
        HttpEndpoint: enabled
        HttpProtocolIpv6: disabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
        InstanceMetadataTags: disabled
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet: [!Ref AgentHostSecurityGroup]
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Ref HostName
        - Key: ki-agent-host-id
          Value: !Ref AgentHostId
        - Key: ki-lifecycle
          Value: prototype
        - Key: ki-work-item
          Value: KI-ARCADIA-GOV-020
      # Shell variables are written $name, never with braces, so Fn::Sub
      # substitutes only the template parameters and pseudo parameters; ${!name}
      # is Fn::Sub's escape for a literal ${name}, which apt's configuration uses.
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a /var/log/ki-agent-host-bootstrap.log | logger -t ki-agent-host-bootstrap -s 2>/dev/console) 2>&1
          export DEBIAN_FRONTEND=noninteractive

          # The OS reports the host's own name, not the AWS default ip-a-b-c-d.
          # preserve_hostname stops cloud-init resetting it on later boots, and the
          # /etc/hosts entry keeps sudo and local lookups resolving it.
          printf 'preserve_hostname: true\n' > /etc/cloud/cloud.cfg.d/99-ki-agent-host-hostname.cfg
          hostnamectl set-hostname ${HostName}
          grep -qE '^127\.0\.1\.1[[:space:]]+${HostName}$' /etc/hosts || printf '127.0.1.1 ${HostName}\n' >> /etc/hosts

          # Access is Tailscale SSH only: no session-manager agent and no OpenSSH listener.
          snap stop --disable amazon-ssm-agent 2>/dev/null || systemctl disable --now amazon-ssm-agent.service 2>/dev/null || true
          systemctl disable --now ssh.socket ssh.service 2>/dev/null || true

          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq tmux xz-utils zsh
          snap install aws-cli --classic

          # OS patching (TECHNE-TOOLS-OPS-022). Security updates install unattended
          # and never restart the host: unattended-upgrades checks for logged-in
          # users when its run ends, not when the restart happens.
          cat > /etc/apt/apt.conf.d/20auto-upgrades <<'APT'
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT
          cat > /etc/apt/apt.conf.d/52ki-agent-host-unattended-upgrades <<'APT'
          // Managed by the ki-agent-host boot script (TECHNE-TOOLS-OPS-022): security origins only.
          #clear Unattended-Upgrade::Allowed-Origins;
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Allowed-Origins {
            "${!distro_id}:${!distro_codename}-security";
            "${!distro_id}ESMApps:${!distro_codename}-apps-security";
            "${!distro_id}ESM:${!distro_codename}-infra-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          APT

          # With a reboot window, a daily timer restarts the host at that time,
          # host-local, only when a reboot is required and who lists no session.
          reboot_window='${RebootWindow}'
          if [[ -n $reboot_window ]]; then
            cat > /usr/local/sbin/ki-agent-host-reboot <<'REBOOT'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ ! -e /var/run/reboot-required ]]; then
            echo 'no reboot required'
            exit 0
          fi
          if [[ -n $(who) ]]; then
            echo 'reboot required, but a session is open; not restarting'
            exit 0
          fi
          echo 'reboot required and nobody logged in; restarting'
          systemctl reboot
          REBOOT
            chmod 0755 /usr/local/sbin/ki-agent-host-reboot
            cat > /etc/systemd/system/ki-agent-host-reboot.service <<'UNIT'
          [Unit]
          Description=Restart the agent host when a reboot is required and nobody is logged in

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/ki-agent-host-reboot
          UNIT
            cat > /etc/systemd/system/ki-agent-host-reboot.timer <<'UNIT'
          [Unit]
          Description=Daily agent-host reboot window (TECHNE-TOOLS-OPS-022)

          [Timer]
          OnCalendar=*-*-* ${RebootWindow}:00

          [Install]
          WantedBy=timers.target
          UNIT
            systemctl daemon-reload
            systemctl enable --now ki-agent-host-reboot.timer
          fi

          node_base=https://nodejs.org/dist/latest-v${NodeMajorVersion}.x
          node_tarball=$(curl -fsSL "$node_base/SHASUMS256.txt" | awk '/linux-x64\.tar\.xz$/ { print $2 }')
          curl -fsSL -o "/tmp/$node_tarball" "$node_base/$node_tarball"
          (cd /tmp && curl -fsSL "$node_base/SHASUMS256.txt" | grep " $node_tarball\$" | sha256sum --check --strict)
          tar -xJf "/tmp/$node_tarball" -C /usr/local --strip-components=1 --no-same-owner
          rm -f "/tmp/$node_tarball"

          if ! id -u '${OperatorUser}' >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash '${OperatorUser}'
          fi
          sudo -u '${OperatorUser}' -H bash -c 'curl -fsSL https://claude.ai/install.sh | bash'

          # GitHub HTTPS credentials come from Parameter Store on demand, so the
          # token is never written to disk on the host.
          cat > /usr/local/bin/git-credential-ki-agent-host <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ $# -eq 1 && $1 == get ]] || exit 0
          protocol=
          host=
          while IFS='=' read -r key value && [[ -n $key ]]; do
            case $key in
              protocol) protocol=$value ;;
              host) host=$value ;;
            esac
          done
          [[ $protocol == https && $host == github.com ]] || exit 0
          token=$(/snap/bin/aws ssm get-parameter --region '${AWS::Region}' --name '${ParameterPrefix}/github-token' --with-decryption --query Parameter.Value --output text)
          printf 'username=x-access-token\npassword=%s\n' "$token"
          HELPER
          chmod 0755 /usr/local/bin/git-credential-ki-agent-host
          sudo -u '${OperatorUser}' -H git config --global credential.https://github.com.helper ki-agent-host

          curl -fsSL https://tailscale.com/install.sh | sh
          umask 077
          key_file=$(mktemp /run/ki-agent-host-tailscale.XXXXXX)
          trap 'rm -f "$key_file"' EXIT
          /snap/bin/aws ssm get-parameter --region '${AWS::Region}' --name '${ParameterPrefix}/tailscale-auth-key' --with-decryption --query Parameter.Value --output text > "$key_file"
          tailscale up --auth-key="file:$key_file" --ssh --advertise-tags='${TailscaleTag}' --hostname=${TailscaleHostname}
          rm -f "$key_file"

          # Livepatch, when the binding opts in: Ubuntu Pro attaches with the
          # binding owner's token, read from Parameter Store into a file on /run
          # (memory, never disk) like the Tailscale key, and removed after.
          livepatch='${Livepatch}'
          if [[ $livepatch == true ]]; then
            pro_file=$(mktemp /run/ki-agent-host-pro.XXXXXX)
            trap 'rm -f "$key_file" "$pro_file"' EXIT
            {
              printf 'token: '
              /snap/bin/aws ssm get-parameter --region '${AWS::Region}' --name '${ParameterPrefix}/ubuntu-pro-token' --with-decryption --query Parameter.Value --output text
              printf 'enable_services:\n  - livepatch\n'
            } > "$pro_file"
            pro attach --attach-config "$pro_file"
            rm -f "$pro_file"
          fi

          install -d -m 0700 /var/lib/ki-agent-host
          touch /var/lib/ki-agent-host/ready
          echo 'ki-agent-host bootstrap complete'

Outputs:
  AgentHostInstanceId:
    Value: !Ref AgentHostInstance
  AgentHostPrivateIp:
    Value: !GetAtt AgentHostInstance.PrivateIp
  AgentHostSecurityGroupId:
    Value: !Ref AgentHostSecurityGroup
  AgentHostRoleName:
    Value: !Ref AgentHostRole
  OperatorUser:
    Value: !Ref OperatorUser
  TailscaleHostname:
    Value: !Ref TailscaleHostname
  TailscaleTag:
    Value: !Ref TailscaleTag
  VpcId:
    Value: !Ref AgentHostVpc
