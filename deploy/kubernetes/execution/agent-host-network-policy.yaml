# Agent-host profile egress allow-list. Additive to the namespace default-deny
# policies, which still govern every pod without the agent-host profile label.
#
# Placeholder destinations: TCP 443 is not yet narrowed to concrete addresses.
# The model API and repository host FQDN or CIDR values need live information
# and are decided before any apply.
#   - model API: <placeholder>
#   - repository host: <placeholder>
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techne-execution-agent-host-egress
  namespace: techne-execution
spec:
  podSelector:
    matchLabels:
      techne.knowledgeislands.dev/profile: agent-host
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
