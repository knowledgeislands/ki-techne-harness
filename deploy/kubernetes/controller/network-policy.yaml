apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techne-controller
  namespace: techne-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: techne-controller
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techne-execution-default-deny
  namespace: techne-execution
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
