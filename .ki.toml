# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-techne-harness"
title = "Techne Harness"
description = "Runnable personal-controller and execution-fabric harness for the Knowledge Islands ecosystem."
repo_code = "TECHNE-TOOLS"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-agent-coordination-paperclip]

[skills.ki-guides]

[skills.ki-tokenomics]

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]

[skills.ki-work-roadmap.areas]
CTRL = "controller"
FAB = "execution-fabric"
OPS = "operations"

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]

[skills.ki-trades.subtypes.knowledge]
techne-architecture-context = "Approved Techne roles, architectural constraints and decision criteria relevant to the receiver. Grants no new implementation scope, priority, deployment or acceptance authority."
techne-interface-compatibility = "Committed Techne interface and compatibility evidence for receiver-owned components. Excludes credentials and private runtime state; grants no implementation, deployment or release authority."

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
export = ["work", "knowledge"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness".standing.export]
knowledge = ["shared-capability-maintenance"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal".standing.import]
knowledge = ["techne-architecture-context"]

[skills.ki-trades.routes."knowledgeislands/tools-techne"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/tools-techne".standing.export]
knowledge = ["techne-interface-compatibility"]

[skills.ki-trades.routes."knowledgeislands/tools-techne".standing.import]
knowledge = ["techne-interface-compatibility"]

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "execution-harness" }
memberships.ki-fnd = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "execution-harness" }
memberships.ki-tools = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "execution-harness" }

[skills.ki-engineering]
