# The agent-host recipe (KI-ARCADIA-GOV-025, TECHNE-TOOLS-OPS-012): an agent
# host whose agents run on the host itself. A binding names one supported
# provider by its provider table; every binding value reaches the scripts only
# through the environment variable declared for it, and each script defaults
# that variable to the first binding's (agent-host) value.
#
# Paths are relative to the harness checkout. A parameter is required, has a
# default or is optional; a default may be derived from the binding through placeholders:
# {name} is the binding name, {<field>} a provider-neutral field and
# {<provider>.<field>} a field of the binding's provider table. Each
# [providers.<provider>] table names a provider the recipe supports.

schema = "techne/recipe/v1"
name = "agent-host"
summary = "Agents run directly on one host reached only over Tailscale SSH"
runtime = "direct"

# Remaining after teardown, which removes only the provider footprint.
footprint = [
  "tailnet device {tailscale_name}",
  "tailnet tag {tailscale_tag}",
  "SSH entry {host_name}",
]

# Provider-neutral scripts act on the host by Tailscale name and SSH only.
[paths]
setup = "operations/aws/agent-host/setup.sh"
status = "operations/aws/agent-host/status.sh"
# The pins (TECHNE-TOOLS-OPS-014): Rig's agent-host profile, one variant per target OS.
pins = "recipes/agent-host/rig.toml"

# The status report (ODR-KI-ARCADIA-001): `status --json` prints one document
# of this schema, and the exit status carries its outcome. `--fetch` updates
# remote-tracking refs first; `--connect-timeout <seconds>` bounds the read.
[status]
schema = "techne/host-workspace/v1"

[status.exit]
clean = 0
failed = 1
at-risk = 3
unknown = 4
unreachable = 255

# Teardown operations, each run as `<script> <operation>`. Each refuses unless
# the status is clean, short of `--discard <repository>...` naming exactly the
# repositories at risk or `--discard-unreadable-host` with typed confirmation.
[operations.rebuild]
summary = "Replace the host, keeping the credentials the next build reuses"
script = "destroy"

[operations.withdraw]
summary = "Remove the host and every stored credential, then list what remains by hand"
script = "destroy"

# OS patching (TECHNE-TOOLS-OPS-022), declared once as intent; each provider
# table gives its mechanism in its own patching table. Security
# updates install unattended as root, set up when the host is built or
# enrolled; the operator user never needs root for patching. Livepatch is
# opt-in. A reboot happens only at the binding's daily reboot_window, and only
# when one is required and nobody is logged in; with no window the host never
# restarts itself, and the binding owner restarts it through the provider's
# stop and start. The report fields are the status document's optional
# `updates` member; they never change the outcome or the exit status.
[patching]
unattended = "security"
livepatch = "opt-in"
reboot = "window"
report = [
  "os",
  "pending",
  "security",
  "reboot_required",
  "reboot_required_since",
  "reboot_packages",
  "livepatch",
]

[parameters.host_name]
summary = "Operating-system host name and resource name"
default = "ki-techne-{name}"
env = "AGENT_HOST_NAME"
scripts = ["provision", "stop"]

[parameters.tailscale_name]
summary = "Tailnet device name, used as the SSH target"
default = "ki-techne-{name}"
env = "AGENT_HOST_TAILSCALE_NAME"
scripts = ["setup", "status", "provision", "stop", "destroy"]

[parameters.tailscale_tag]
summary = "Tailnet tag the host advertises"
default = "tag:ki-techne-{name}"
env = "AGENT_HOST_TAILSCALE_TAG"
scripts = ["provision"]

[parameters.repositories]
summary = "Repository list file, one `<owner>/<repo> <clone URL>` per line"
default = "operations/aws/agent-host/host/repositories.txt"
env = "AGENT_HOST_REPOSITORIES"
scripts = ["setup", "status", "stop", "destroy"]

[parameters.workspace]
summary = "Workspace root on the host; a leading ~/ is the operator's home there"
default = "~/workspaces/kit"
env = "KI_AGENT_HOST_WORKSPACE"
scripts = ["setup", "status", "stop", "destroy"]

# Optional: absent means no automatic reboot and no Livepatch.
[parameters.reboot_window]
summary = "Daily host-local time, a 24-hour HH:MM, at which the host restarts itself when a reboot is required and nobody is logged in"
optional = true
env = "AGENT_HOST_REBOOT_WINDOW"
scripts = ["provision"]

[parameters.livepatch]
summary = "Whether critical kernel fixes go live without a restart, through the provider's Livepatch where it has one"
optional = true
env = "AGENT_HOST_LIVEPATCH"
scripts = ["provision"]

# The binding owner's workstation layer (TECHNE-TOOLS-OPS-015). Optional:
# absent means the host gets the recipe layer alone. The payload is a
# techne/host-profile/v1 directory rendered on the operator's workstation.
[parameters.profile]
summary = "Directory of the binding owner's rendered host payload on the operator's workstation"
optional = true
env = "AGENT_HOST_PROFILE"
scripts = ["setup"]

[parameters.shell]
summary = "Interactive shell sessions hand off to: bash or zsh"
default = "zsh"
env = "AGENT_HOST_SHELL"
scripts = ["setup"]

[providers.aws]
summary = "One EC2 instance in its own VPC, built by a CloudFormation stack"
footprint = [
  "CloudFormation stack {aws.stack_name}",
  "SSM parameters {aws.parameter_prefix}/",
  "IAM operator role {aws.operator_role}",
  "AWS operator profile {aws.operator_profile}",
]

[providers.aws.paths]
template = "infra/aws/agent-host-stack.yaml"
provision = "operations/aws/agent-host/provision.sh"
stop = "operations/aws/agent-host/stop.sh"
destroy = "operations/aws/agent-host/destroy.sh"

[providers.aws.parameters.account]
summary = "AWS account the footprint lives in; credentials in any other are refused"
required = true
env = "EXPECTED_AWS_ACCOUNT"
scripts = ["provision", "stop", "destroy"]

[providers.aws.parameters.region]
summary = "AWS region"
required = true
env = "AWS_REGION"
scripts = ["provision", "stop", "destroy"]

[providers.aws.parameters.admin_profile]
summary = "Administrative profile that provisions and destroys the footprint"
required = true
env = "AWS_PROFILE"
scripts = ["provision", "destroy"]

[providers.aws.parameters.operator_profile]
summary = "Least-privilege profile that assumes the operator role"
required = true
env = "AWS_PROFILE"
scripts = ["stop"]

[providers.aws.parameters.tag]
summary = "Value of the host id tag on the stack and every resource"
default = "{name}"
env = "AGENT_HOST_ID"
scripts = ["provision", "stop", "destroy"]

[providers.aws.parameters.stack_name]
summary = "CloudFormation stack name"
default = "ki-techne-{name}"
env = "AGENT_HOST_STACK_NAME"
scripts = ["provision", "destroy"]

[providers.aws.parameters.parameter_prefix]
summary = "SSM Parameter Store prefix holding the host's secrets"
default = "/ki/techne/{name}"
env = "AGENT_HOST_PARAMETER_PREFIX"
scripts = ["provision", "destroy"]

[providers.aws.parameters.operator_role]
summary = "IAM role the operator profile must resolve to; created by hand"
default = "ki-techne-{name}-operator"

[providers.aws.parameters.instance_type]
summary = "EC2 instance type"
default = "t3.medium"
env = "AGENT_HOST_INSTANCE_TYPE"
scripts = ["provision"]

[providers.aws.parameters.volume_size]
summary = "Root volume size in GiB"
default = 40
env = "AGENT_HOST_VOLUME_SIZE"
scripts = ["provision"]

# The boot script sets patching up at build, so a change reaches a host only at
# its next build. Ubuntu Pro is attached from the ubuntu-pro-token SecureString
# only when livepatch is on; the binding owner stores it.
[providers.aws.patching]
unattended = "unattended-upgrades from /etc/apt/apt.conf.d/20auto-upgrades and 52ki-agent-host-unattended-upgrades: security origins only, Automatic-Reboot false"
livepatch = "Ubuntu Pro attached from {aws.parameter_prefix}/ubuntu-pro-token with Livepatch enabled"
reboot = "ki-agent-host-reboot.timer daily at the window, restarting only when /var/run/reboot-required exists and who lists no session"
report = "apt-check counts, /var/run/reboot-required and its packages, and canonical-livepatch or pro status"

# An instance is the binding's only when every selector matches.
[providers.aws.selectors]
tag_key = "ki-agent-host-id"
tag_value = "{aws.tag}"
name_tag = "{host_name}"
stack_tag_key = "ki-agent-host-id"
operator_role = "{aws.operator_role}"

[providers.aws.tags]
ki-lifecycle = "prototype"
ki-work-item = "KI-ARCADIA-GOV-020"
